name: Index official TTL product photos
on:
  push:
    paths:
      - 'scripts/index-ttl-products.py'
      - '.github/workflows/ttl-product-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/index-ttl-products.py
      - name: Save verified catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ttl-product-images.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh verified TTL product photo index"
          git pull --rebase
          git push
