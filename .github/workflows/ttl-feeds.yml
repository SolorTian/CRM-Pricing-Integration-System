name: Refresh TTL news and clearance products
on:
  push:
    paths:
      - 'scripts/update-ttl-feeds.py'
      - '.github/workflows/ttl-feeds.yml'
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ttl-feeds
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/update-ttl-feeds.py
      - name: Publish feed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ttl-feeds.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh TTL news and clearance feed"
          git pull --rebase
          git push
